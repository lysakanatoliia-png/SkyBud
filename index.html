<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYBUD — Система документов</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Шапка сайта -->
  <header class="site-header">
    <a class="site-logo" href="index.html"><span>SKY</span>BUD</a>
    <div class="header-meta" data-i18n="header.meta">Формы интервью</div>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="de">DE</button>
    </div>
  </header>

  <!-- Hero-блок -->
  <div class="page-hero">
    <p class="page-hero__eyebrow" data-i18n="index.eyebrow">SKYBUD / Формы</p>
    <h1 class="page-hero__title" data-i18n="index.title">Формы интервью</h1>
    <p class="page-hero__subtitle" data-i18n="index.subtitle">Заполните форму или скачайте пустой шаблон PDF</p>
  </div>

  <!-- Каталог форм -->
  <div class="docs-section">
    <div class="docs-grid docs-grid--single">

      <!-- Карточка — Engineering Call Interview Form -->
      <div class="doc-card doc-card--featured">
        <h2 class="doc-card__title" data-i18n="index.card-title">Engineering Call Interview Form</h2>
        <p class="doc-card__desc" data-i18n="index.card-desc">
          Форма для сбора технических данных по объекту, инженерным системам и исходным материалам для расчёта.
        </p>
        <div class="doc-card__actions">
          <a href="engineering-call-interview-form.html" class="btn btn--primary" data-i18n="index.btn-open">Открыть форму</a>
          <a href="engineering-call-interview-form.html?blank=true" target="_blank" class="btn btn--secondary" data-i18n="index.btn-pdf">Скачать PDF</a>
        </div>
      </div>

    </div>
  </div>

  <script src="js/translations.js" defer></script>
  <script src="js/lang-switcher.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
